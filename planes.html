<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Planes y precios | Daima Belleza Studio</title>
  <meta name="description" content="Todos los planes, combos y servicios de Daima Belleza Studio con precios y duracion." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;600&display=swap" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    :root {
      --c-bg: #FCFBFA;
      --c-surface: #FFFFFF;
      --c-text: #2D2926;
      --c-muted: #78736F;
      --c-accent: #D1BBA4;
      --c-accent-dark: #B59C82;
      --c-accent-text: #84715E;
      --c-border: #EBE6E0;
      --f-sans: 'Inter', system-ui, sans-serif;
      --f-serif: 'Playfair Display', Georgia, serif;
    }
    * { box-sizing: border-box; }
    body.planes-page {
      margin: 0; min-height: 100vh;
      font-family: var(--f-sans);
      background:
        radial-gradient(1200px 500px at 10% -10%, #f3ebe3 0%, transparent 55%),
        radial-gradient(900px 420px at 100% 0%, #efe7de 0%, transparent 50%),
        var(--c-bg);
      color: var(--c-text);
    }
    .planes-top {
      position: sticky; top: 0; z-index: 30;
      display: flex; align-items: center; gap: .65rem;
      padding: .75rem 1rem; padding-top: max(.75rem, env(safe-area-inset-top));
      background: rgba(252,251,250,.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--c-border);
    }
    .planes-top a.back {
      color: var(--c-text); text-decoration: none; font-size: .9rem; white-space: nowrap;
    }
    .planes-top .spacer { flex: 1; }
    .btn-book-top {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 40px; padding: .45rem 1rem;
      border-radius: 999px; text-decoration: none; font-size: .78rem; font-weight: 600;
      letter-spacing: .04em; text-transform: uppercase;
      background: transparent; color: var(--c-accent-text);
      border: 1.5px solid var(--c-accent-dark);
    }
    .btn-book-top:hover { background: #f4ede6; }
    .cart-btn {
      position: relative; border: 1px solid var(--c-border); background: var(--c-surface);
      border-radius: 999px; width: 42px; height: 42px; display: grid; place-items: center; cursor: pointer;
    }
    .cart-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.7; }
    .cart-count {
      position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 4px;
      border-radius: 9px; background: var(--c-accent-dark); color: #fff; font-size: .65rem;
      display: grid; place-items: center; font-weight: 600;
    }
    .planes-hero {
      padding: 1.75rem 1.15rem 1rem; max-width: 920px; margin: 0 auto;
    }
    .planes-hero .eyebrow {
      font-size: .72rem; letter-spacing: .16em; text-transform: uppercase;
      color: var(--c-accent-text); margin-bottom: .45rem;
    }
    .planes-hero h1 {
      font-family: var(--f-serif); font-weight: 400; font-size: clamp(1.8rem, 5vw, 2.4rem);
      line-height: 1.15; margin: 0 0 .5rem;
    }
    .planes-hero p { margin: 0; color: var(--c-muted); max-width: 34rem; line-height: 1.55; }
    .planes-wrap { padding: 0 1rem 7rem; max-width: 920px; margin: 0 auto; }
    .plan-group { margin-bottom: 2.25rem; }
    .plan-group-head {
      display: flex; align-items: baseline; justify-content: space-between; gap: .75rem;
      margin-bottom: .9rem; padding-bottom: .55rem; border-bottom: 1px solid var(--c-border);
    }
    .plan-group-head h2 {
      font-family: var(--f-serif); font-weight: 400; font-size: 1.35rem; margin: 0;
    }
    .plan-group-head span { font-size: .72rem; color: var(--c-muted); letter-spacing: .06em; text-transform: uppercase; }
    .svc-grid {
      display: grid; gap: .8rem;
      grid-template-columns: 1fr;
    }
    @media (min-width: 640px) {
      .svc-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .svc-card {
      position: relative; border: 1px solid var(--c-border); border-radius: 18px;
      padding: 1.05rem 1rem 1rem; text-align: left; cursor: pointer;
      background: var(--c-surface); transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
      overflow: hidden; min-height: 138px; display: flex; flex-direction: column;
      font: inherit; color: inherit; width: 100%;
    }
    .svc-card:hover, .svc-card:focus-visible {
      transform: translateY(-2px); border-color: var(--c-accent);
      box-shadow: 0 14px 32px rgba(45,41,38,.07); outline: none;
    }
    .svc-card::before {
      content: ''; position: absolute; inset: 0 auto 0 0; width: 4px;
      background: var(--accent-line, var(--c-accent));
    }
    .svc-card[data-tone="maquillaje"] { --accent-line: #C4A484; background: linear-gradient(145deg, #fff 60%, #faf4ee); }
    .svc-card[data-tone="combos"] { --accent-line: #B59C82; background: linear-gradient(145deg, #fff 55%, #f7f0e8); }
    .svc-card[data-tone="peinados"] { --accent-line: #9A8B7A; background: linear-gradient(145deg, #fff 55%, #f5f2ee); }
    .svc-card[data-tone="extras"] { --accent-line: #D1BBA4; background: linear-gradient(145deg, #fff 55%, #faf7f3); }
    .svc-card .tone-mark {
      position: absolute; right: .7rem; top: .7rem;
      width: 34px; height: 34px; border-radius: 50%;
      display: grid; place-items: center;
      background: rgba(209,187,164,.22); color: var(--c-accent-text);
      font-family: var(--f-serif); font-size: .95rem;
    }
    .svc-card h3 {
      font-family: var(--f-serif); font-weight: 400; font-size: 1.12rem;
      line-height: 1.25; margin: 0 2.4rem .45rem 0;
    }
    .svc-card .blurb {
      margin: 0; font-size: .84rem; color: var(--c-muted); line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      flex: 1;
    }
    .svc-meta {
      display: flex; align-items: baseline; justify-content: space-between; gap: .75rem;
      margin-top: .85rem; padding-top: .7rem; border-top: 1px solid rgba(235,230,224,.9);
    }
    .svc-meta .mins { font-size: .75rem; color: var(--c-muted); letter-spacing: .04em; }
    .svc-meta .price {
      font-family: var(--f-serif); font-size: 1.35rem; color: var(--c-text);
    }
    .svc-card.popular { border-color: var(--c-accent-dark); }
    .svc-card .badge {
      position: absolute; left: 1rem; top: -.35rem;
      background: var(--c-text); color: #fff; font-size: .65rem; letter-spacing: .08em;
      text-transform: uppercase; padding: .22rem .55rem; border-radius: 999px;
    }

    /* Sheet / modal */
    .sheet-bg {
      position: fixed; inset: 0; z-index: 50; background: rgba(45,41,38,.42);
      display: none; align-items: flex-end; justify-content: center;
    }
    .sheet-bg.on { display: flex; }
    .sheet {
      width: min(100%, 520px); max-height: min(88vh, 720px);
      background: var(--c-bg); border-radius: 22px 22px 0 0;
      padding: 1rem 1.1rem calc(1.2rem + env(safe-area-inset-bottom));
      overflow: auto; box-shadow: 0 -20px 50px rgba(0,0,0,.18);
      animation: sheetUp .28s ease;
    }
    @keyframes sheetUp { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
    .sheet-handle {
      width: 42px; height: 4px; border-radius: 99px; background: #ddd5cb; margin: .15rem auto .9rem;
    }
    .sheet-tone {
      display: inline-block; font-size: .68rem; letter-spacing: .12em; text-transform: uppercase;
      color: var(--c-accent-text); margin-bottom: .35rem;
    }
    .sheet h2 {
      font-family: var(--f-serif); font-weight: 400; font-size: 1.55rem;
      line-height: 1.2; margin: 0 0 .65rem;
    }
    .sheet .desc { margin: 0 0 1rem; color: var(--c-muted); line-height: 1.55; }
    .sheet-stats {
      display: grid; grid-template-columns: 1fr 1fr; gap: .65rem; margin-bottom: 1.15rem;
    }
    .sheet-stat {
      background: var(--c-surface); border: 1px solid var(--c-border); border-radius: 14px; padding: .75rem .85rem;
    }
    .sheet-stat .l { font-size: .68rem; text-transform: uppercase; letter-spacing: .1em; color: var(--c-muted); }
    .sheet-stat .v { font-family: var(--f-serif); font-size: 1.35rem; margin-top: .15rem; }
    .sheet-actions { display: grid; gap: .55rem; }
    .sheet-actions .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: .55rem; }
    .btn-soft {
      min-height: 46px; border-radius: 999px; border: 1px solid var(--c-border);
      background: var(--c-surface); color: var(--c-text); font: inherit; font-weight: 600; cursor: pointer;
    }
    .btn-brand {
      min-height: 46px; border-radius: 999px; border: 0;
      background: var(--c-accent-dark); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
      text-decoration: none; display: grid; place-items: center;
    }
    .btn-brand:hover { filter: brightness(.96); }
    .sheet-close {
      position: absolute; right: 1rem; top: 1rem; border: 0; background: transparent;
      font-size: 1.4rem; line-height: 1; cursor: pointer; color: var(--c-muted);
    }
    .sheet { position: relative; }

    /* Cart drawer */
    .cart-drawer {
      position: fixed; inset: 0; z-index: 60; display: none; background: rgba(45,41,38,.4);
    }
    .cart-drawer.on { display: block; }
    .cart-panel {
      position: absolute; right: 0; top: 0; bottom: 0; width: min(100%, 380px);
      background: var(--c-bg); padding: 1rem 1rem 1.25rem; display: flex; flex-direction: column;
      box-shadow: -12px 0 40px rgba(0,0,0,.12);
    }
    .cart-panel h2 { margin: 0 0 1rem; font-family: var(--f-serif); font-weight: 400; font-size: 1.35rem; }
    .cart-list { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: .7rem; }
    .cart-item {
      display: grid; grid-template-columns: 1fr auto; gap: .5rem; align-items: start;
      padding: .75rem 0; border-bottom: 1px solid var(--c-border);
    }
    .cart-item strong { display: block; font-size: .92rem; line-height: 1.3; }
    .cart-item .sub { font-size: .78rem; color: var(--c-muted); margin-top: .2rem; }
    .cart-item .qty { display: flex; align-items: center; gap: .35rem; margin-top: .45rem; }
    .cart-item button.q {
      width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--c-border);
      background: var(--c-surface); cursor: pointer;
    }
    .cart-foot { border-top: 1px solid var(--c-border); padding-top: .9rem; }
    .cart-foot .total { display: flex; justify-content: space-between; font-size: 1.05rem; margin-bottom: .75rem; }
    .cart-foot .total strong { font-family: var(--f-serif); font-size: 1.35rem; }
    .cart-close { border: 0; background: none; font-size: 1.4rem; cursor: pointer; float: right; line-height: 1; color: var(--c-muted); }
    .empty-note { text-align: center; color: var(--c-muted); padding: 2rem 1rem; }
  </style>
</head>
<body class="planes-page">
  <header class="planes-top">
    <a class="back" href="/">← Inicio</a>
    <div class="spacer"></div>
    <a class="btn-book-top" href="https://wa.me/593958757109?text=Hola%20Daima%20Belleza%2C%20quiero%20agendar%20mi%20cita." target="_blank" rel="noopener">Agendar</a>
    <button type="button" class="cart-btn" id="btnCart" aria-label="Carrito de belleza">
      <svg viewBox="0 0 24 24"><path d="M3 5h2l2.2 10.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H7"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
      <span class="cart-count" id="cartCount" hidden>0</span>
    </button>
  </header>

  <section class="planes-hero">
    <div class="eyebrow">Inversión en ti</div>
    <h1>Todos los planes</h1>
    <p>Elige un servicio, mira el detalle y reserva uno o arma tu carrito de belleza para agendar varios juntos.</p>
  </section>

  <main class="planes-wrap" id="planesRoot">
    <p class="empty-note">Cargando precios…</p>
  </main>

  <div class="sheet-bg" id="sheetBg" aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-handle"></div>
      <button type="button" class="sheet-close" id="sheetClose" aria-label="Cerrar">×</button>
      <div class="sheet-tone" id="sheetTone"></div>
      <h2 id="sheetTitle"></h2>
      <p class="desc" id="sheetDesc"></p>
      <div class="sheet-stats">
        <div class="sheet-stat"><div class="l">Duración</div><div class="v" id="sheetMins"></div></div>
        <div class="sheet-stat"><div class="l">Precio</div><div class="v" id="sheetPrice"></div></div>
      </div>
      <div class="sheet-actions">
        <div class="btn-row">
          <button type="button" class="btn-soft" id="sheetAdd">Sumar al carrito</button>
          <a class="btn-brand" id="sheetBook" href="#" target="_blank" rel="noopener">Reservar este</a>
        </div>
      </div>
    </div>
  </div>

  <div class="cart-drawer" id="drawer" aria-hidden="true">
    <div class="cart-panel" role="dialog" aria-label="Carrito de belleza">
      <button type="button" class="cart-close" id="closeCart" aria-label="Cerrar">×</button>
      <h2>Carrito de belleza</h2>
      <div class="cart-list" id="cartList"></div>
      <div class="cart-foot">
        <div class="total"><span>Total</span><strong id="cartTotal">$0</strong></div>
        <a class="btn-brand" id="checkout" href="#" style="width:100%">Agendar selección</a>
      </div>
    </div>
  </div>

  <script>
  (function () {
    const WA = '593958757109';
    const KEY = 'daima_beauty_cart_v1';
    const GROUPS = [
      { id: 'maquillaje', title: 'Maquillaje', mark: 'M', tone: 'maquillaje', keys: ['social', 'graduacion', 'novia'] },
      { id: 'combos', title: 'Combos', mark: 'C', tone: 'combos', keys: ['combo_consentidor', 'combo_pasarela'] },
      { id: 'peinados', title: 'Peinados & cabello', mark: 'P', tone: 'peinados', keys: ['planchado', 'ondas', 'ondas_reina', 'semirecogido', 'recogido', 'hidratacion', 'keratina'] },
      { id: 'extras', title: 'Pestañas & cejas', mark: 'E', tone: 'extras', keys: ['pestanas_clasicas', 'pestanas_muneca', 'pestanas_anime', 'pestanas_hibridas', 'cejas_henna'] },
    ];
    const FALLBACK_DESC = {
      social: 'Look completo para eventos y salidas. Incluye pestañas de tira, técnica a elección y sellado de alta duración para que dure toda la noche.',
      graduacion: 'Acabado fotogénico pensado para fotos y videos. Triple sellado y pestañas a elección para un resultado limpio y luminoso.',
      novia: 'Diseño nupcial o de quinceañera con prueba incluida. Un look a prueba de emociones, lágrimas y flash.',
      combo_consentidor: 'Maquillaje social profesional más peinado en ondas sueltas. Ideal cuando quieres salir lista sin pensar en dos citas.',
      combo_pasarela: 'Maquillaje con técnica a elección más ondas de reina. El combo de impacto para momentos que piden protagonismo.',
      planchado: 'Planchado o cepillado exprés para un cabello liso, brillante y ordenado en minutos.',
      ondas: 'Ondas suaves y naturales, perfectas para el día a día o como base de un peinado más elaborado.',
      ondas_reina: 'Ondas de reina o de agua con volumen y movimiento. Un peinado de evento que luce en persona y en fotos.',
      semirecogido: 'Semirecogido elegante: suelta el rostro y deja caída suave. Ideal para graduaciones y fiestas.',
      recogido: 'Recogido limpio o romántico, sujeto para que aguante baile, calor y abrazos.',
      hidratacion: 'Tratamiento de hidratación profunda para devolver suavidad y brillo al cabello reseco o maltratado.',
      keratina: 'Alisado de keratina profesional (precio desde, según largo). Reduce frizz y facilita el peinado diario.',
      pestanas_clasicas: 'Extensiones punto a punto estilo clásico: mirada definida y natural.',
      pestanas_muneca: 'Estilo muñeca: más densidad y curva para una mirada abierta y glam.',
      pestanas_anime: 'Estilo anime: picos y drama controlado para un look de tendencia.',
      pestanas_hibridas: 'Mezcla de técnicas para volumen y definición a la vez.',
      cejas_henna: 'Diseño de cejas con henna, visagismo y depilación para enmarcar el rostro.',
    };

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const money = (n) => {
      const p = Number(n);
      if (!Number.isFinite(p)) return String(n);
      return Number.isInteger(p) ? String(p) : p.toFixed(2).replace(/\.00$/, '');
    };
    const waLink = (text) => 'https://wa.me/' + WA + '?text=' + encodeURIComponent(text);

    let services = [];
    let active = null;
    let cart = [];
    try { cart = JSON.parse(localStorage.getItem(KEY) || '[]'); if (!Array.isArray(cart)) cart = []; } catch { cart = []; }

    const root = document.getElementById('planesRoot');
    const sheetBg = document.getElementById('sheetBg');
    const drawer = document.getElementById('drawer');

    function saveCart() {
      localStorage.setItem(KEY, JSON.stringify(cart));
      renderCart();
    }
    function renderCart() {
      const qty = cart.reduce((a, i) => a + i.qty, 0);
      const elCount = document.getElementById('cartCount');
      elCount.hidden = qty === 0;
      elCount.textContent = String(qty);
      const total = cart.reduce((a, i) => a + i.qty * Number(i.precio || 0), 0);
      document.getElementById('cartTotal').textContent = '$' + money(total);
      const list = document.getElementById('cartList');
      if (!cart.length) {
        list.innerHTML = '<p class="empty-note">Tu carrito de belleza está vacío. Toca un servicio para sumarlo.</p>';
      } else {
        list.innerHTML = cart.map((i) => `
          <div class="cart-item" data-id="${esc(i.id)}">
            <div>
              <strong>${esc(i.nombre)}</strong>
              <div class="sub">$${esc(money(i.precio))} · ${esc(i.duration_minutes || '—')} min</div>
              <div class="qty">
                <button type="button" class="q" data-act="dec" aria-label="Menos">−</button>
                <span>${i.qty}</span>
                <button type="button" class="q" data-act="inc" aria-label="Más">+</button>
              </div>
            </div>
            <button type="button" class="q" data-act="rm" aria-label="Quitar">✕</button>
          </div>`).join('');
      }
      const lines = cart.map((i) => `• ${i.nombre} x${i.qty} ($${money(i.precio)})`).join('\n');
      const msg = `Hola Daima Belleza! Quiero agendar mi carrito de belleza:\n${lines}\nTotal: $${money(total)}`;
      document.getElementById('checkout').href = waLink(msg);
    }

    function openSheet(svc, group) {
      active = svc;
      document.getElementById('sheetTone').textContent = group ? group.title : 'Servicio';
      document.getElementById('sheetTitle').textContent = svc.name;
      const desc = (svc.description && String(svc.description).trim()) || FALLBACK_DESC[svc.key] || 'Servicio profesional en Daima Belleza Studio, Portoviejo.';
      document.getElementById('sheetDesc').textContent = desc;
      document.getElementById('sheetMins').textContent = (svc.duration_minutes || '—') + ' min';
      document.getElementById('sheetPrice').textContent = '$' + money(svc.price);
      document.getElementById('sheetBook').href = waLink(`Hola Daima Belleza! Quiero reservar: ${svc.name} ($${money(svc.price)}, ${svc.duration_minutes || '?'} min)`);
      sheetBg.classList.add('on');
      sheetBg.setAttribute('aria-hidden', 'false');
    }
    function closeSheet() {
      sheetBg.classList.remove('on');
      sheetBg.setAttribute('aria-hidden', 'true');
      active = null;
    }
    function addToCart(svc) {
      const id = svc.key || svc.id || svc.name;
      const row = cart.find((x) => String(x.id) === String(id));
      if (row) row.qty += 1;
      else cart.push({
        id,
        nombre: svc.name,
        precio: svc.price,
        duration_minutes: svc.duration_minutes,
        qty: 1,
      });
      saveCart();
    }

    function render(list) {
      services = list;
      const byKey = Object.fromEntries(list.map((s) => [s.key, s]));
      const used = new Set();
      let html = '';
      for (const g of GROUPS) {
        const items = g.keys.map((k) => byKey[k]).filter(Boolean);
        items.forEach((s) => used.add(s.key));
        if (!items.length) continue;
        html += `<section class="plan-group" data-group="${esc(g.id)}">
          <div class="plan-group-head"><h2>${esc(g.title)}</h2><span>${items.length} opciones</span></div>
          <div class="svc-grid">` +
          items.map((s) => {
            const popular = s.key === 'combo_consentidor';
            const blurb = (s.description && String(s.description).trim()) || FALLBACK_DESC[s.key] || '';
            return `<button type="button" class="svc-card${popular ? ' popular' : ''}" data-tone="${esc(g.tone)}" data-key="${esc(s.key)}">
              ${popular ? '<span class="badge">Más pedido</span>' : ''}
              <span class="tone-mark" aria-hidden="true">${esc(g.mark)}</span>
              <h3>${esc(s.name)}</h3>
              <p class="blurb">${esc(blurb)}</p>
              <div class="svc-meta">
                <span class="mins">${esc(s.duration_minutes || '—')} min</span>
                <span class="price">$${esc(money(s.price))}</span>
              </div>
            </button>`;
          }).join('') +
          `</div></section>`;
      }
      const rest = list.filter((s) => !used.has(s.key));
      if (rest.length) {
        html += `<section class="plan-group"><div class="plan-group-head"><h2>Más servicios</h2><span>${rest.length}</span></div><div class="svc-grid">` +
          rest.map((s) => `<button type="button" class="svc-card" data-tone="extras" data-key="${esc(s.key)}">
            <span class="tone-mark">+</span><h3>${esc(s.name)}</h3>
            <div class="svc-meta"><span class="mins">${esc(s.duration_minutes || '—')} min</span><span class="price">$${esc(money(s.price))}</span></div>
          </button>`).join('') + `</div></section>`;
      }
      root.innerHTML = html || '<p class="empty-note">No hay planes disponibles.</p>';
    }

    root.addEventListener('click', (e) => {
      const card = e.target.closest('.svc-card');
      if (!card) return;
      const svc = services.find((s) => s.key === card.dataset.key);
      if (!svc) return;
      const group = GROUPS.find((g) => (g.keys || []).includes(svc.key));
      openSheet(svc, group);
    });
    document.getElementById('sheetClose').addEventListener('click', closeSheet);
    sheetBg.addEventListener('click', (e) => { if (e.target === sheetBg) closeSheet(); });
    document.getElementById('sheetAdd').addEventListener('click', () => {
      if (!active) return;
      addToCart(active);
      closeSheet();
      drawer.classList.add('on');
      drawer.setAttribute('aria-hidden', 'false');
    });
    document.getElementById('btnCart').addEventListener('click', () => {
      drawer.classList.add('on'); drawer.setAttribute('aria-hidden', 'false');
    });
    document.getElementById('closeCart').addEventListener('click', () => {
      drawer.classList.remove('on'); drawer.setAttribute('aria-hidden', 'true');
    });
    drawer.addEventListener('click', (e) => {
      if (e.target === drawer) { drawer.classList.remove('on'); drawer.setAttribute('aria-hidden', 'true'); }
    });
    document.getElementById('cartList').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-act]');
      if (!btn) return;
      const item = btn.closest('.cart-item');
      if (!item) return;
      const id = item.dataset.id;
      const row = cart.find((x) => String(x.id) === String(id));
      if (!row) return;
      const act = btn.dataset.act;
      if (act === 'inc') row.qty += 1;
      if (act === 'dec') row.qty -= 1;
      if (act === 'rm' || row.qty <= 0) cart = cart.filter((x) => String(x.id) !== String(id));
      saveCart();
    });

    fetch('/api/landing-catalog', { cache: 'no-store' })
      .then((r) => r.json())
      .then((data) => {
        const list = (data.services || []).filter((s) => s && s.visible !== false);
        render(list);
        renderCart();
      })
      .catch(() => { root.innerHTML = '<p class="empty-note">No se pudieron cargar los planes.</p>'; });
  })();
  </script>
</body>
</html>
