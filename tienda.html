<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda | Daima Belleza Studio</title>
  <meta name="description" content="Tienda de Daima Belleza Studio. Busca productos y arma tu pedido." />
  <link rel="stylesheet" href="/style.css" />
  <style>
    .shop-page { min-height: 100vh; background: var(--c-bg); color: var(--c-text); }
    .shop-top {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; gap: .75rem;
      padding: .85rem 1rem; background: rgba(252,251,250,.96);
      backdrop-filter: blur(10px); border-bottom: 1px solid var(--c-border);
    }
    .shop-top a.back { color: var(--c-text); text-decoration: none; font-size: .9rem; white-space: nowrap; }
    .shop-search {
      flex: 1; display: flex; align-items: center; gap: .5rem;
      border: 1px solid var(--c-border); border-radius: 999px;
      padding: .55rem .9rem; background: var(--c-surface);
    }
    .shop-search svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; flex-shrink: 0; opacity: .7; }
    .shop-search input {
      border: 0; outline: 0; width: 100%; background: transparent;
      font: inherit; font-size: 1rem; color: var(--c-text);
    }
    .cart-btn {
      position: relative; border: 1px solid var(--c-border); background: var(--c-bg);
      border-radius: 999px; width: 42px; height: 42px; display: grid; place-items: center; cursor: pointer;
    }
    .cart-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.7; }
    .cart-count {
      position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 4px;
      border-radius: 9px; background: var(--c-text); color: var(--c-bg); font-size: .65rem;
      display: grid; place-items: center; font-weight: 600;
    }
    .shop-wrap { padding: 1.25rem 1rem 6rem; max-width: 1100px; margin: 0 auto; }
    .shop-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem;
    }
    @media (min-width: 700px) {
      .shop-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.25rem; }
    }
    .shop-card {
      background: var(--c-bg); border: 1px solid var(--c-border); border-radius: var(--radius);
      overflow: hidden; display: flex; flex-direction: column;
    }
    .shop-card img, .shop-card .sin-foto {
      width: 100%; aspect-ratio: 1/1; object-fit: cover; background: var(--c-surface);
    }
    .shop-card .body { padding: .9rem; display: flex; flex-direction: column; gap: .35rem; flex: 1; }
    .shop-card h3 { font-size: 1rem; margin: 0; line-height: 1.25; }
    .shop-card .desc { font-size: .85rem; color: var(--c-muted, #666); margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .shop-card .price { font-family: var(--f-serif); font-size: 1.25rem; margin: .25rem 0 .5rem; }
    .shop-card button.add {
      margin-top: auto; border: 1px solid var(--c-border); background: var(--c-text); color: var(--c-bg);
      border-radius: 999px; padding: .65rem .9rem; font: inherit; cursor: pointer;
    }
    .shop-empty { text-align: center; padding: 3rem 1rem; color: var(--c-muted, #666); }
    .cart-drawer {
      position: fixed; inset: 0; z-index: 40; display: none; background: rgba(0,0,0,.35);
    }
    .cart-drawer.on { display: block; }
    .cart-panel {
      position: absolute; right: 0; top: 0; bottom: 0; width: min(100%, 380px);
      background: var(--c-bg); padding: 1rem 1rem 1.25rem; display: flex; flex-direction: column;
      box-shadow: -12px 0 40px rgba(0,0,0,.12);
    }
    .cart-panel h2 { margin: 0 0 1rem; font-size: 1.25rem; }
    .cart-list { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: .75rem; }
    .cart-item { display: grid; grid-template-columns: 56px 1fr auto; gap: .65rem; align-items: center; }
    .cart-item img, .cart-item .sin { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; background: var(--c-surface); }
    .cart-item .qty { display: flex; align-items: center; gap: .35rem; }
    .cart-item button.q {
      width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--c-border);
      background: var(--c-surface); cursor: pointer;
    }
    .cart-foot { border-top: 1px solid var(--c-border); padding-top: .9rem; }
    .cart-foot .total { display: flex; justify-content: space-between; font-size: 1.1rem; margin-bottom: .75rem; }
    .cart-foot .btn { width: 100%; text-align: center; }
    .cart-close { border: 0; background: none; font-size: 1.4rem; cursor: pointer; float: right; line-height: 1; }
  </style>
</head>
<body class="shop-page">
  <header class="shop-top">
    <a class="back" href="/">← Inicio</a>
    <label class="shop-search" aria-label="Buscar productos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar productos…" autocomplete="off" />
    </label>
    <button type="button" class="cart-btn" id="btnCart" aria-label="Abrir carrito">
      <svg viewBox="0 0 24 24"><path d="M3 5h2l2.2 10.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H7"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
      <span class="cart-count" id="cartCount" hidden>0</span>
    </button>
  </header>

  <main class="shop-wrap">
    <h1 class="title-lg" style="margin:0 0 1rem;font-size:1.6rem">Tienda</h1>
    <div id="grid" class="shop-grid"></div>
    <p id="empty" class="shop-empty" hidden>No hay productos que coincidan.</p>
  </main>

  <div class="cart-drawer" id="drawer" aria-hidden="true">
    <div class="cart-panel" role="dialog" aria-label="Carrito">
      <button type="button" class="cart-close" id="closeCart" aria-label="Cerrar">×</button>
      <h2>Tu carrito</h2>
      <div class="cart-list" id="cartList"></div>
      <div class="cart-foot">
        <div class="total"><span>Total</span><strong id="cartTotal">$0</strong></div>
        <a class="btn btn-primary" id="checkout" href="#">Pedir por WhatsApp</a>
      </div>
    </div>
  </div>

  <script>
  (function () {
    const KEY = 'daima_cart_v1';
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const money = (n) => '$' + (Number(n) || 0).toFixed(2).replace(/\.00$/, '');
    let productos = [];
    let cart = [];
    try { cart = JSON.parse(localStorage.getItem(KEY) || '[]'); if (!Array.isArray(cart)) cart = []; } catch { cart = []; }

    const elGrid = document.getElementById('grid');
    const elEmpty = document.getElementById('empty');
    const elQ = document.getElementById('q');
    const elCount = document.getElementById('cartCount');
    const elDrawer = document.getElementById('drawer');
    const elList = document.getElementById('cartList');
    const elTotal = document.getElementById('cartTotal');
    const elCheckout = document.getElementById('checkout');

    function save() { localStorage.setItem(KEY, JSON.stringify(cart)); renderCartChrome(); }

    function renderCartChrome() {
      const qty = cart.reduce((a, i) => a + i.qty, 0);
      elCount.hidden = qty === 0;
      elCount.textContent = String(qty);
      const total = cart.reduce((a, i) => a + i.qty * Number(i.precio || 0), 0);
      elTotal.textContent = money(total);
      if (!cart.length) {
        elList.innerHTML = '<p class="shop-empty">Tu carrito está vacío.</p>';
      } else {
        elList.innerHTML = cart.map((i) => `
          <div class="cart-item" data-id="${esc(i.id)}">
            ${i.foto ? `<img src="${esc(i.foto)}" alt="">` : '<div class="sin"></div>'}
            <div>
              <strong>${esc(i.nombre)}</strong>
              <div>${money(i.precio)}</div>
              <div class="qty">
                <button type="button" class="q" data-act="dec" aria-label="Menos">−</button>
                <span>${i.qty}</span>
                <button type="button" class="q" data-act="inc" aria-label="Más">+</button>
              </div>
            </div>
            <button type="button" class="q" data-act="rm" aria-label="Quitar">✕</button>
          </div>`).join('');
      }
      const lines = cart.map((i) => `• ${i.nombre} x${i.qty} (${money(i.precio)})`).join('%0A');
      const text = encodeURIComponent(`Hola Daima! Quiero pedir:%0A${decodeURIComponent(lines)}%0ATotal: ${money(total)}`);
      // rebuild properly
      const msg = `Hola Daima! Quiero pedir:\n` + cart.map((i) => `• ${i.nombre} x${i.qty} ($${i.precio})`).join('\n') + `\nTotal: ${money(total)}`;
      elCheckout.href = 'https://wa.me/593958757109?text=' + encodeURIComponent(msg);
    }

    function renderGrid() {
      const q = (elQ.value || '').trim().toLowerCase();
      const list = productos.filter((p) => {
        if (!q) return true;
        const blob = `${p.nombre || ''} ${p.descripcion || ''}`.toLowerCase();
        return blob.includes(q);
      });
      elEmpty.hidden = list.length > 0;
      elGrid.innerHTML = list.map((p) => `
        <article class="shop-card">
          ${p.foto ? `<img src="${esc(p.foto)}" alt="${esc(p.nombre)}" loading="lazy">` : '<div class="sin-foto"></div>'}
          <div class="body">
            <h3>${esc(p.nombre)}</h3>
            ${p.descripcion ? `<p class="desc">${esc(p.descripcion)}</p>` : ''}
            <p class="price">${money(p.precio)}</p>
            <button type="button" class="add" data-id="${esc(p.id)}">Agregar</button>
          </div>
        </article>`).join('');
    }

    function add(id) {
      const p = productos.find((x) => String(x.id) === String(id));
      if (!p) return;
      const row = cart.find((x) => String(x.id) === String(id));
      if (row) row.qty += 1;
      else cart.push({ id: p.id, nombre: p.nombre, precio: p.precio, foto: p.foto || '', qty: 1 });
      save();
    }

    elGrid.addEventListener('click', (e) => {
      const btn = e.target.closest('button.add');
      if (!btn) return;
      add(btn.dataset.id);
    });
    elList.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-act]');
      if (!btn) return;
      const item = btn.closest('.cart-item');
      if (!item) return;
      const id = item.dataset.id;
      const row = cart.find((x) => String(x.id) === String(id));
      if (!row) return;
      const act = btn.dataset.act;
      if (act === 'inc') row.qty += 1;
      if (act === 'dec') row.qty -= 1;
      if (act === 'rm' || row.qty <= 0) cart = cart.filter((x) => String(x.id) !== String(id));
      save();
    });
    elQ.addEventListener('input', renderGrid);
    document.getElementById('btnCart').addEventListener('click', () => {
      elDrawer.classList.add('on'); elDrawer.setAttribute('aria-hidden', 'false');
    });
    document.getElementById('closeCart').addEventListener('click', () => {
      elDrawer.classList.remove('on'); elDrawer.setAttribute('aria-hidden', 'true');
    });
    elDrawer.addEventListener('click', (e) => {
      if (e.target === elDrawer) {
        elDrawer.classList.remove('on'); elDrawer.setAttribute('aria-hidden', 'true');
      }
    });

    fetch('/api/productos', { cache: 'no-store' })
      .then((r) => r.json())
      .then((data) => {
        productos = Array.isArray(data.productos) ? data.productos : [];
        renderGrid();
        renderCartChrome();
      })
      .catch(() => {
        elEmpty.hidden = false;
        elEmpty.textContent = 'No se pudo cargar la tienda.';
      });
  })();
  </script>
</body>
</html>
